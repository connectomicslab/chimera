name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 3.9/3.10 cannot resolve: clabtoolkit needs scipy>=1.16, which is
        # Python 3.11+ only. See requires-python in pyproject.toml.
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint with ruff
      run: |
        ruff check chimera tests

    - name: Check formatting with black
      run: |
        black --check chimera tests

    - name: Type check with mypy
      run: |
        mypy chimera

    - name: Test with pytest
      shell: bash
      run: |
        set +e
        pytest tests/ -v --cov=chimera --cov-report=xml
        status=$?
        # TODO: remove once tests/ contains real tests. Exit code 5 is
        # pytest's "no tests collected", which is the current state of the
        # stub suite; any other non-zero status is a genuine failure.
        if [ "$status" -eq 5 ]; then
          echo "::warning::No tests collected - tests/ is still a stub."
          exit 0
        fi
        exit $status

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.xml
        # No CODECOV_TOKEN is configured, so uploads are tokenless and can be
        # rate-limited. A flaky upload must not fail an otherwise green run,
        # and with no tests there may be no coverage.xml to upload at all.
        fail_ci_if_error: false

  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install pre-commit
      run: pip install pre-commit
    - name: Run pre-commit
      run: pre-commit run --all-files