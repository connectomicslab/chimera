name: Publish Python distribution to PyPI and TestPyPI

# Publishing is gated so it can never fire on an ordinary push:
#   * pushing a version tag (v*)      -> build + publish to TestPyPI
#   * publishing a GitHub Release     -> build + publish to PyPI
# The two-step flow lets you verify the TestPyPI upload before releasing.
#
# Uploads authenticate via PyPI Trusted Publishing (OIDC), not API tokens, so
# both indexes need a publisher registered once against this exact workflow:
#   owner=connectomicslab  repo=chimera  workflow=python-package.yml
#   https://pypi.org/manage/project/chimera-brainparcellation/settings/publishing/
#   https://test.pypi.org/manage/project/chimera-brainparcellation/settings/publishing/
# Renaming this file breaks the trust relationship and uploads start failing.
on:
  push:
    tags:
      - "v*"
  release:
    types: [published]

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install pypa/build
        run: python3 -m pip install --upgrade pip build twine
      - name: Build a binary wheel and a source tarball
        run: python3 -m build
      - name: Verify distribution metadata
        # Catches README/metadata problems here rather than as a rejected upload.
        run: python3 -m twine check dist/*
      - name: Store the distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-to-testpypi:
    name: Publish Python distribution to TestPyPI
    # Only on a version tag push (pre-release verification step).
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs:
      - build
    runs-on: ubuntu-latest
    # Authentication is PyPI Trusted Publishing (OIDC): no API token secret is
    # involved, so this permission is what lets the upload authenticate at all.
    permissions:
      id-token: write
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distribution to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-to-pypi:
    name: Publish Python distribution to PyPI
    # Only when a GitHub Release is published, after TestPyPI has been checked.
    if: github.event_name == 'release'
    needs:
      - build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
