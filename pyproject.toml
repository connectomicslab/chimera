[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chimera-brainparcellation"
version = "0.4.0"
description = "An open source framework for combining multiple parcellations of the human brain"
readme = "README.md"
authors = [
    {name = "Yasser Aleman Gomez", email = "yasseraleman@protonmail.com"}
]
license = {text = "Apache-2.0"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Image Processing",
]
# clabtoolkit requires scipy>=1.16, and scipy 1.16 is the first release to drop
# Python 3.10, so 3.11 is the real floor regardless of what the declared
# requires-python of those dependencies says.
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.16.0",
    "pandas>=1.3.0",
    "nibabel>=3.2.0",
    "pybids>=0.15.0",
    "templateflow>=0.8.0",
    "clabtoolkit>=0.4.2",
    "rich>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "black>=22.0",
    "ruff>=0.0.200",
    "mypy>=0.900",
    "pre-commit>=2.15",
]
docs = [
    "sphinx==8.2.3",
    "sphinx-rtd-theme==3.0.2",
]

[project.scripts]
chimera = "chimera.cli:main"

[project.urls]
Homepage = "https://github.com/yasseraleman/chimera"
Repository = "https://github.com/yasseraleman/chimera"
Documentation = "https://chimera.readthedocs.io"
"Bug Reports" = "https://github.com/yasseraleman/chimera/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["chimera*"]

[tool.setuptools.package-data]
chimera = ["data/*", "config/*", "config/supraregions/*"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    # The remaining 23 findings are all unused bindings that are deliberate:
    # attributes unpacked together to document a dict's shape, and calls kept
    # for their side effects (_set_templateflow_home, tflow.get, gii2annot)
    # whose return value is not needed. Removing them would lose that context
    # or, worse, drop the call. Re-enable if the bindings are ever cleaned up.
    "F841",  # local variable assigned but never used
    "B007",  # loop control variable not used in body
    "B905",  # zip() without explicit strict=
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["B011"]

[tool.mypy]
# 3.12 rather than the 3.11 floor: numpy's bundled stubs use `type` aliases,
# which mypy only parses when targeting 3.12+, and a parse error in a stub is
# fatal. ruff and black still target py311, so 3.11-incompatible syntax is
# caught there.
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
# The codebase is largely unannotated, so demanding annotations everywhere
# buries the errors that indicate real type bugs. These stay off until the
# modules they apply to actually carry annotations; tighten per-module via
# an override rather than flipping them back on globally.
disallow_any_generics = false
disallow_incomplete_defs = false
disallow_untyped_defs = false
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = [
    "nibabel.*",
    "clabtoolkit.*",
    "templateflow.*",
    "bids.*",
    "pandas.*",
    "scipy.*",
]
ignore_missing_imports = true

# Modules that still carry unresolved type errors, mostly str/Path variables
# reassigned to the other type and arguments whose declared type does not match
# what callers pass. They are skipped so the rest of the package is genuinely
# type-checked instead of the step being disabled outright.
#
# This list is meant to shrink. Drop a module, run mypy, fix what it reports.
# Counts when this was written:
#   parcellation_builder  142
#   region_table           14
#   core                   12
#   cli                     7
#   config_manager          9
#   processing              3
[[tool.mypy.overrides]]
module = [
    "chimera.parcellation_builder",
    "chimera.region_table",
    "chimera.core",
    "chimera.cli",
    "chimera.config_manager",
    "chimera.processing",
]
ignore_errors = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = [
    "tests",
]

[tool.bumpversion]
current_version = "0.4.0"
commit = true
tag = true

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "chimera/__init__.py"
search = "__version__ = \"{current_version}\""
replace = "__version__ = \"{new_version}\""